services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luckydraw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luckydraw"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    # không volume: key idempotency mất khi restart thì DB vẫn gánh (fail-open)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s   
      timeout: 3s    
      retries: 5      
      start_period: 5s 
    restart: unless-stopped
  app:
    image: ghcr.io/kivenhuy/promotion-go:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/luckydraw?sslmode=disable
      REDIS_ADDR: redis:6379
      DEBUG_ADDR: ":6060"
      MAX_INFLIGHT: "50"
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy # Ứng dụng Go chỉ chạy khi Redis báo HEALTHY
    restart: unless-stopped
volumes:
  pgdata:
