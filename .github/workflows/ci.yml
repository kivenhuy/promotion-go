name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env: 
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luckydraw?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luckydraw
        ports:
          - 5432:5432
        options:   >-  
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
         
    steps:
      # 1. checkout code
      - uses: 
          actions/checkout@v5
       # 2. setup Go đúng version trong go.mod
      - uses: 
          actions/setup-go@v6
        with: 
          go-version-file: go.mod
      # 3. cài goose, chạy migrations
      - run: |
            go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
            goose -dir migrations postgres "$TEST_DATABASE_URL" up

      # 4. go vet ./...
      - run: go vet ./...
      # 5. go test -race -count=5 ./...
      - run: go test -race -count=5 ./...
