name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env: 
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/luckydraw?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luckydraw
        ports:
          - 5432:5432
        options:   >-  
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
         
    steps:
      # 1. checkout code
      - uses: 
          actions/checkout@v5
       # 2. setup Go đúng version trong go.mod
      - uses: 
          actions/setup-go@v6
        with: 
          go-version-file: go.mod
      # 3. cài goose, chạy migrations
      - run: |
            go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
            goose -dir migrations postgres "$TEST_DATABASE_URL" up

      # 4. go vet ./...
      - run: go vet ./...
      # 5. go test -race -count=5 ./...
      - run: go test -race -count=5 ./...
      - run: docker build -t promotion-go .
      - run: |
          docker run -d --name app --network host -e DATABASE_URL="$TEST_DATABASE_URL" promotion-go
          sleep 3
          docker logs app
          curl -f localhost:8080/healthz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        run: |
          docker tag promotion-go ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag promotion-go ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
